<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="英语听写">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>英语听写</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f2f6fc;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      z-index: 9999;
    }
    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #cfe0ff;
      border-top-color: #1d6bf0;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { margin: 0; font-size: 15px; color: #5a7cb8; }
    #loading .hint { margin-top: 10px; font-size: 13px; color: #8ba3c8; line-height: 1.7; text-align: center; }
  </style>

  <div id="loading">
    <div class="spinner"></div>
    <p>英语听写 · 正在加载…</p>
    <p class="hint">首次加载需下载运行引擎，请稍候片刻；<br>之后再次打开即可秒开使用</p>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // 首帧渲染完成后隐藏加载提示
    window.addEventListener('flutter-first-frame', function () {
      const el = document.getElementById('loading');
      if (el) el.style.display = 'none';
    });
  </script>
</body>
</html>
