<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="英语听写">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>英语听写</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      min-width: 540px;
      min-height: 660px;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f2f6fc;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      z-index: 9999;
    }
    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #cfe0ff;
      border-top-color: #1d6bf0;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { margin: 0; font-size: 15px; color: #5a7cb8; }
    #loading .bar-wrap { width: 220px; height: 6px; background: #dbe7fb; border-radius: 3px; margin: 14px 0 8px; overflow: hidden; }
    #loading .bar { height: 100%; width: 0; background: #1d6bf0; border-radius: 3px; transition: width 0.25s ease; }
    #loading .progress { margin: 0; font-size: 14px; color: #1d6bf0; font-weight: 600; }
    #loading .hint { margin-top: 10px; font-size: 13px; color: #8ba3c8; line-height: 1.7; text-align: center; }
  </style>

  <div id="loading">
    <div class="spinner"></div>
    <p>英语听写 · 正在加载…</p>
    <div class="bar-wrap"><div id="load-bar" class="bar"></div></div>
    <p id="load-progress" class="progress">0%</p>
    <p class="hint">首次加载需下载运行引擎，请稍候片刻；<br>之后再次打开即可秒开使用</p>
  </div>

  <!--
    自定义 Flutter 启动：显示真实的下载进度百分比。
    参考: https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
  </script>
  <script>
    // ── 加载进度显示 ─────────────────────────────────────────
    // 注：此 Flutter 引擎版本不上报真实下载字节数，故用平滑模拟进度，
    // 若引擎偶尔返回有效字节数据则自动切换为真实百分比。
    const progressEl = document.getElementById('load-progress');
    const barEl = document.getElementById('load-bar');
    let pct = 0;
    let realMode = false;

    function setPct(v) {
      if (progressEl) progressEl.textContent = v + '%';
      if (barEl) barEl.style.width = v + '%';
    }

    // 模拟进度：先快后慢地升到 92%
    const simTimer = setInterval(function () {
      if (realMode) return; // 已切换到真实进度
      pct = Math.min(92, pct + (92 - pct) * 0.05 + 0.4);
      setPct(Math.round(pct));
    }, 180);

    function finishLoading() {
      clearInterval(simTimer);
      setPct(100);
      const el = document.getElementById('loading');
      if (el) el.style.display = 'none';
    }
    window.addEventListener('flutter-first-frame', finishLoading);

    // ── 自定义 Flutter 启动（保留真实进度回调兜底）──────────
    _flutter.loader.load({
      onEntrypointLoaded: async function (engineInitializer) {
        let appRunner = await engineInitializer.initializeEngine({
          onProgress: function (progress) {
            if (!progress || progress.totalBytes <= 0 || progress.downloadedBytes == null) return;
            realMode = true;
            clearInterval(simTimer);
            setPct(Math.min(99, Math.round(progress.downloadedBytes / progress.totalBytes * 100)));
          }
        });
        await appRunner.runApp();
      }
    });
  </script>
</body>
</html>
